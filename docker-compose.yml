services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mextdir
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mextdir"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mextdir-postgres:/var/lib/postgresql/data

  mextdir:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      DEMO_MODE: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-local-admin-key}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/.output/public/uploads
    ports:
      - "3000:3000"

volumes:
  mextdir-postgres:
