services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mextdir
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mextdir"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mextdir-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mextdir-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/mextdir
      && mc anonymous set download local/mextdir"

  mextdir:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      DEMO_MODE: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-mextdir}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/mextdir}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MEXT_IMPORT_SECRET: ${MEXT_IMPORT_SECRET:?Set MEXT_IMPORT_SECRET}
    ports:
      - "3000:3000"

  mextdir-ingest:
    build:
      context: ./ingestor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mextdir:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set MISTRAL_API_KEY}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-4-0}
      MISTRAL_OCR_TIMEOUT_MS: ${MISTRAL_OCR_TIMEOUT_MS:-300000}
      MEXT_APP_URL: http://mextdir:3000
      MEXT_IMPORT_SECRET: ${MEXT_IMPORT_SECRET:?Set MEXT_IMPORT_SECRET}
      MEXT_IMPORT_INTERVAL_SECONDS: ${MEXT_IMPORT_INTERVAL_SECONDS:-86400}
      MEXT_IMPORT_RUN_ON_START: ${MEXT_IMPORT_RUN_ON_START:-true}
      PYTHONUNBUFFERED: "1"

volumes:
  mextdir-postgres:
  mextdir-minio:
