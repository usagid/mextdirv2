name: mextdir-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mextdir
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mextdir"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mextdir-dev-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mextdir-dev-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/mextdir
      && mc anonymous set download local/mextdir"

  mextdir:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      DEMO_MODE: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-local-admin-key}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mextdir
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9002/mextdir
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3001:3000"
    command: ["sh", "-c", "pnpm db:deploy && pnpm dev --host 0.0.0.0"]
    volumes:
      - .:/app
      - mextdir-dev-node-modules:/app/node_modules
      - mextdir-dev-nuxt:/app/.nuxt

volumes:
  mextdir-dev-postgres:
  mextdir-dev-minio:
  mextdir-dev-node-modules:
  mextdir-dev-nuxt:
