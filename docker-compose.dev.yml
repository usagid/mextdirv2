name: mextdir-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mextdir
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mextdir"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mextdir-dev-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mextdir-dev-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c "mc alias set local http://minio:9000 minioadmin minioadmin
      && mc mb --ignore-existing local/mextdir
      && mc anonymous set download local/mextdir"

  mextdir:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      DEMO_MODE: "false"
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-local-admin-key}
      UMAMI_URL: ${UMAMI_URL:?Set UMAMI_URL}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:?Set UMAMI_WEBSITE_ID}
      NUXT_PUBLIC_UMAMI_URL: ${UMAMI_URL:?Set UMAMI_URL}
      NUXT_PUBLIC_UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:?Set UMAMI_WEBSITE_ID}
      X402_ENABLED: ${X402_ENABLED:-true}
      X402_ENVIRONMENT: development
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      X402_FACILITATOR_AUTH_TOKEN: ${X402_FACILITATOR_AUTH_TOKEN:-}
      X402_EVM_PAY_TO: ${X402_EVM_PAY_TO:?Set X402_EVM_PAY_TO}
      X402_SOLANA_PAY_TO: ${X402_SOLANA_PAY_TO:?Set X402_SOLANA_PAY_TO}
      X402_SOLANA_RPC_URL: ${X402_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: mextdir
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_URL: http://localhost:9002/mextdir
      S3_FORCE_PATH_STYLE: "true"
      MEXT_IMPORT_SECRET: ${MEXT_IMPORT_SECRET:?Set MEXT_IMPORT_SECRET}
    ports:
      - "3001:3000"
    command:
      ["sh", "-c", "pnpm db:deploy && pnpm prepare && pnpm dev --host 0.0.0.0"]
    volumes:
      - .:/app
      - mextdir-dev-node-modules:/app/node_modules
      - mextdir-dev-nuxt:/app/.nuxt

  mextdir-ingest:
    build:
      context: ./ingestor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mextdir:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mextdir?schema=public
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set MISTRAL_API_KEY}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-mistral-ocr-4-0}
      MISTRAL_OCR_TIMEOUT_MS: ${MISTRAL_OCR_TIMEOUT_MS:-300000}
      MEXT_APP_URL: http://mextdir:3000
      MEXT_IMPORT_SECRET: ${MEXT_IMPORT_SECRET:?Set MEXT_IMPORT_SECRET}
      MEXT_IMPORT_INTERVAL_SECONDS: ${MEXT_IMPORT_INTERVAL_SECONDS:-86400}
      MEXT_IMPORT_RUN_ON_START: ${MEXT_IMPORT_RUN_ON_START:-true}
      PYTHONUNBUFFERED: "1"

volumes:
  mextdir-dev-postgres:
  mextdir-dev-minio:
  mextdir-dev-node-modules:
  mextdir-dev-nuxt:
